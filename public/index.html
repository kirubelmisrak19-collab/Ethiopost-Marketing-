<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ethiopost Marketing Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app-root">
    <!-- Clean Minimalist Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="brand-badge">
          <div class="brand-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 13V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v12c0 1.1.9 2 2 2h9"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
              <circle cx="18" cy="18" r="3"></circle>
              <polyline points="18,17 18,18 19,19"></polyline>
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-title">ETHIOPOST</span>
            <span class="brand-sub">Marketing Command</span>
          </div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="#/overview" class="nav-link" data-route="overview">
          <span class="nav-icon" id="icon-overview"></span>
          <span>Overview</span>
        </a>
        <a href="#/campaigns" class="nav-link" data-route="campaigns">
          <span class="nav-icon" id="icon-campaigns"></span>
          <span>Campaigns</span>
        </a>
        <a href="#/advertisements" class="nav-link" data-route="advertisements">
          <span class="nav-icon" id="icon-advertisements"></span>
          <span>Advertisements</span>
        </a>
        <a href="#/calendar" class="nav-link" data-route="calendar">
          <span class="nav-icon" id="icon-calendar"></span>
          <span>Calendar</span>
        </a>
        <a href="#/activities" class="nav-link" data-route="activities">
          <span class="nav-icon" id="icon-activities"></span>
          <span>Activities</span>
        </a>
        <a href="#/budget" class="nav-link" data-route="budget">
          <span class="nav-icon" id="icon-budget"></span>
          <span>Budgets</span>
        </a>
        <a href="#/reports" class="nav-link" data-route="reports">
          <span class="nav-icon" id="icon-reports"></span>
          <span>Reports</span>
        </a>
        <a href="#/team" class="nav-link" data-route="team">
          <span class="nav-icon" id="icon-team"></span>
          <span>Team & Access</span>
        </a>
        <a href="#/settings" class="nav-link" data-route="settings">
          <span class="nav-icon" id="icon-settings"></span>
          <span>Settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-chip" id="user-chip-btn" title="Click to switch team role">
          <div class="user-avatar" id="sidebar-user-avatar">DT</div>
          <div class="user-info">
            <div class="user-name" id="sidebar-user-name">Dawit Tadesse</div>
            <div class="user-role" id="sidebar-user-role">Marketing Manager</div>
          </div>
          <span style="margin-left: auto; font-size: 10px; color: var(--ep-muted); padding-right: 4px;">▼</span>
        </div>
        <div id="user-switch-dropdown" class="user-switch-dropdown">
          <!-- Injected dynamically with all 10 roles -->
        </div>
      </div>
    </aside>

    <!-- Main Workspace Area -->
    <div id="main-layout">
      <!-- Minimalist Header Bar -->
      <header id="top-header">
        <div class="header-left">
          <div id="header-breadcrumb" class="header-breadcrumb">
            <span class="crumb-root">Ethiopost</span>
            <span class="crumb-separator">/</span>
            <span id="page-title" class="crumb-active">Overview</span>
          </div>
        </div>

        <div class="header-right">
          <!-- Search box -->
          <div class="header-search-wrap">
            <span class="search-icon" id="icon-search"></span>
            <input type="text" id="global-search-input" placeholder="Search campaigns, ads, outlets..." autocomplete="off">
            <span style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); pointer-events: none;"><kbd class="kbd">Ctrl K</kbd></span>
            <div id="search-dropdown" class="search-dropdown"></div>
          </div>

          <!-- Month Selector -->
          <div class="month-selector-wrap">
            <select id="global-month-select" class="header-select">
              <option value="2026-10" selected>October 2026</option>
              <option value="2026-11">November 2026</option>
              <option value="2026-12">December 2026</option>
              <option value="2027-01">January 2027</option>
            </select>
          </div>

          <!-- Quick Actions Button -->
          <button id="primary-action-btn" class="btn btn-primary">
            <span id="icon-plus"></span>
            <span id="primary-action-label">+ New Campaign</span>
          </button>
        </div>
      </header>

      <!-- Dynamic View Container -->
      <main id="view-container">
        <!-- Injected via client-side router -->
      </main>
    </div>
  </div>

  <!-- Dynamic Modals Container -->
  <div id="modal-container"></div>

  <!-- Global Slide-Over Media Flight Drawer -->
  <div id="placement-drawer-backdrop" class="drawer-backdrop">
    <div class="drawer-panel" id="placement-drawer-panel">
      <div class="drawer-header">
        <div>
          <div style="font-size: 15px; font-weight: 700; color: var(--ep-text);">Media Flight Specifications</div>
          <div style="font-size: 11.5px; color: var(--ep-muted);" id="drawer-subtitle">Contract & Airtime Details</div>
        </div>
        <button class="modal-close" onclick="window.closePlacementDrawer()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
      </div>
      <div class="drawer-body" id="drawer-content">
        <!-- Injected dynamically via window.inspectPlacement -->
      </div>
      <div class="drawer-footer" id="drawer-footer">
        <button class="btn btn-secondary" onclick="window.closePlacementDrawer()">Close</button>
        <div id="drawer-action-slot"></div>
      </div>
    </div>
  </div>

  <!-- Quiet Toast Feedback Container -->
  <div id="toast-container"></div>

  <!-- App Bootstrap -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
